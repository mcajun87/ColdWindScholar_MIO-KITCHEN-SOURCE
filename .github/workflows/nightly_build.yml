name: "Build Tool Nightly"
permissions:
  contents: write
  discussions: write

on:
  schedule:
    - cron: '0 2 * * *' # 每天凌晨 2 点运行
  push:
    paths:
      - "bin/update.json"
  workflow_dispatch:

jobs:
  # ================== 主发布任务 ==================
  build:
    # 注意：如果某个平台构建失败，加上 always() 可以让主 Job 依然尝试发布成功的平台
    if: always()
    needs: [build-win, build-linux, build-macos, build-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 5 # 为了下面生成日志用
          
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          merge-multiple: true
          
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install Packages
        run: |
          python3 -m pip install -U --force-reinstall pip requests
          sudo apt install git erofs-utils android-sdk-libsparse-utils -y
          
      - name: Generate Release Content
        run: |
          python3 build.py grb || true
          python3 build.py ma || true
          if [ ! -f "body.md" ] || grep -q "Create sync.yml" "body.md"; then
            echo "### 🌙 MIO-KITCHEN Nightly Changelog (Android 17)" > body.md
            echo "" >> body.md
            git log -n 5 --pretty=format:"- %s (%an)" >> body.md
          fi
          
      - name: Upload release
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          prerelease: true
          omitBodyDuringUpdate: true
          removeArtifacts: true
          name: "MIO-KITCHEN Nightly (Android 17)"
          tag: "nightly-build${{ github.run_number }}"
          bodyFile: "body.md"
          artifacts: "./artifacts/*.zip"

  # ================== Windows 构建 ==================
  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'
      - name: Update pip
        run: python -m pip install -U --force-reinstall pip requests
      - name: Pack tool
        env:
          TARGET_ANDROID: "17"
        run: python build.py
      - name: Upload Win Build
        uses: actions/upload-artifact@v4
        with:
          name: MIO-KITCHEN-win-nightly
          path: './*.zip'

  # ================== Linux 构建 ==================
  build-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            arch_suffix: amd64
          - arch: arm64
            runner: ubuntu-latest # 修正：原 ubuntu-26.04-arm 不存在
            arch_suffix: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # 修正：原 3.14 不存在
      - name: Install Packages
        run: |
          python3 -m pip install -U --force-reinstall pip requests
          sudo apt install liblzo2-dev erofs-utils -y
      - name: Pack Tool
        env:
          TARGET_ANDROID: "17"
        run: python3 build.py
      - name: Rename Artifact Safely
        run: |
          zip_files=(MIO-KITCHEN*.zip)
          if [ -f "${zip_files[0]}" ]; then
            mv "${zip_files[0]}" "MIO-KITCHEN-linux-${{ matrix.arch_suffix }}-nightly.zip"
          fi
      - name: Upload Linux Build
        uses: actions/upload-artifact@v4
        with:
          name: MIO-KITCHEN-linux-${{ matrix.arch_suffix }}-nightly
          path: './MIO-KITCHEN-linux-${{ matrix.arch_suffix }}-nightly.zip'

  # ================== macOS 构建 ==================
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            suffix: arm64
          - os: macos-13 # 修正：原 macos-26-intel 不存在
            suffix: intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # 修正：统一版本避免不兼容
      - name: Install Packages
        run: |
          python3 -m pip install -U --force-reinstall pip requests
      - name: Pack Tool
        env:
          TARGET_ANDROID: "17"
        run: python3 build.py
      - name: Rename Artifact Safely
        run: |
          zip_files=(MIO-KITCHEN*.zip)
          if [ -f "${zip_files[0]}" ]; then
            mv "${zip_files[0]}" "MIO-KITCHEN-macos-${{ matrix.suffix }}-nightly.zip"
          fi
      - name: Upload Macos Build
        uses: actions/upload-artifact@v4
        with:
          name: MIO-KITCHEN-macos-${{ matrix.suffix }}-nightly
          path: './MIO-KITCHEN-macos-${{ matrix.suffix }}-nightly.zip'

  # ================== Android 构建 ==================
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Packages
        run: |
          python3 -m pip install -U --force-reinstall pip requests
          sudo apt update && sudo apt install -y erofs-utils android-sdk-libsparse-utils
      - name: Pack Tool for Android (Termux Native)
        env:
          TARGET_ANDROID: "17"
          PLATFORM_TARGET: "android"
        run: |
          python3 build.py || python3 build.py android || true
      - name: Rename Artifact Safely
        run: |
          zip_files=(MIO-KITCHEN*.zip)
          if [ -f "${zip_files[0]}" ]; then
            mv "${zip_files[0]}" "MIO-KITCHEN-android-arm64-nightly.zip"
          fi
      - name: Upload Android Build
        uses: actions/upload-artifact@v4
        with:
          name: MIO-KITCHEN-android-arm64-nightly
          path: './MIO-KITCHEN-android-arm64-nightly.zip'