name: "Update Binary"
permissions:
  contents: write
  discussions: write
on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11' # 推荐使用更稳定成熟的 3.11 版本，避免 3.14 预发布版本可能带来的兼容或三方库问题
      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install requests
      - name: Update
        run: |
          python3 ./config upbin
          git config --local user.email "3590361911@qq.com"
          git config --local user.name "ColdWindScholar"
          git remote set-url origin https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          git add bin
          git commit --allow-empty -m "Update binary"
          git push