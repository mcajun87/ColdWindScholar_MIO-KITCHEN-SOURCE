name: "Build Tool"
permissions:
  contents: write
  discussions: write
on:
  push:
    paths:
      - "bin/update.json"
  workflow_dispatch:
jobs:
  build:
    needs: [build-win, build-linux, build-macos, build-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Packages
        run: |
          python3 -m pip install -U --force-reinstall pip requests
          sudo apt update && sudo apt install -y git erofs-utils android-sdk-libsparse-utils
      - name: Generate Release Content
        run: |
          python3 build.py grb || true
          python3 build.py ma || true
          if [ ! -f "body.md" ] || grep -q "Create sync.yml" "body.md"; then
            echo "### 🚀 MIO-KITCHEN Changelog (Android 17 & All Platforms)" > body.md
            echo "" >> body.md
            git log -n 5 --pretty=format:"- %s (%an)" >> body.md
          fi
      - name: Upload release
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          omitBodyDuringUpdate: true
          removeArtifacts: true
          name: "MIO-KITCHEN Universal Release (Android 17)"
          tag: "CI_BUILD_${{ github.run_number }}"
          bodyFile: "body.md"
          artifacts: "*.zip"

  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
      - name: Update pip
        run: python -m pip install -U --force-reinstall pip requests
      - name: Pack tool
        env:
          TARGET_ANDROID: "17"
        run: python build.py
      - name: Upload Win Build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MIO-KITCHEN-win
          path: './MIO-KITCHEN-win.zip'

  build-linux:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            arch_suffix: amd64
          - arch: arm64
            runner: ubuntu-26.04-arm
            arch_suffix: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install Packages
        run: |
          python3 -m pip install -U --force-reinstall pip requests
          sudo apt install liblzo2-dev erofs-utils -y
      - name: Pack Tool
        env:
          TARGET_ANDROID: "17"
        run: python3 build.py
      - name: Rename Artifact to Avoid Overwrite
        run: |
          mv MIO-KITCHEN-linux.zip MIO-KITCHEN-linux-${{ matrix.arch_suffix }}.zip
      - name: Upload Linux Build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MIO-KITCHEN-linux-${{ matrix.arch_suffix }}
          path: './MIO-KITCHEN-linux-${{ matrix.arch_suffix }}.zip'

  build-macos:
    strategy:
      matrix:
        include:
          - os: macos-latest
            suffix: arm64
          - os: macos-26-intel
            suffix: intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Packages
        run: |
          python3 -m pip install -U --force-reinstall pip requests
      - name: Pack Tool
        env:
          TARGET_ANDROID: "17"
        run: python3 build.py
      - name: Rename Artifact to Avoid Overwrite
        run: |
          mv MIO-KITCHEN-macos.zip MIO-KITCHEN-macos-${{ matrix.suffix }}.zip
      - name: Upload Arm64 Macos Build
        if: success() && matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: MIO-KITCHEN-macos
          path: './MIO-KITCHEN-macos-arm64.zip'
      - name: Upload x86_64 Macos Build
        if: success() && matrix.os == 'macos-26-intel'
        uses: actions/upload-artifact@v4
        with:
          name: MIO-KITCHEN-macos-intel
          path: './MIO-KITCHEN-macos-intel.zip'

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Packages
        run: |
          python3 -m pip install -U --force-reinstall pip requests
          sudo apt update && sudo apt install -y erofs-utils android-sdk-libsparse-utils
      - name: Pack Tool for Android (Termux Native)
        env:
          TARGET_ANDROID: "17"
          PLATFORM_TARGET: "android"
        run: |
          python3 build.py || python3 build.py android || true
      - name: Upload Android Build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MIO-KITCHEN-android-arm64
          path: './MIO-KITCHEN-android.zip'