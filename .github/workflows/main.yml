name: "MIO-KITCHEN Full Platforms Build & Release"
permissions:
  contents: write
  discussions: write
on:
  push:
    paths:
      - "bin/update.json"
  workflow_dispatch:

jobs:
  build:
    needs: [build-win, build-linux, build-macos, build-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Packages
        run: |
          python3 -m pip install -U --force-reinstall pip requests
          sudo apt update && sudo apt install -y git erofs-utils android-sdk-libsparse-utils
      - name: Generate Release Content
        run: |
          python3 build.py grb || true
          python3 build.py ma || true
      - name: Upload release
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          omitBodyDuringUpdate: true
          removeArtifacts: true
          name: "MIO-KITCHEN Universal Release (Android 17 & All Platforms)"
          tag: "CI_BUILD_${{ github.run_number }}"
          bodyFile: "body.md"
          artifacts: "*.zip"

  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'
      - name: Update pip and dependencies
        run: |
          python -m pip install -U --force-reinstall pip requests
      - name: Pack tool for Windows
        env:
          TARGET_ANDROID: "17"
        run: python build.py
      - name: Upload Win Build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MIO-KITCHEN-win-android17
          path: './MIO-KITCHEN-win.zip'

  build-linux:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            arch_suffix: amd64
          - arch: arm64
            runner: ubuntu-22.04
            arch_suffix: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Packages
        run: |
          python3 -m pip install -U --force-reinstall pip requests
          sudo apt update && sudo apt install -y liblzo2-dev erofs-utils
      - name: Pack Tool for Linux
        env:
          TARGET_ANDROID: "17"
        run: python3 build.py
      - name: Upload Linux Build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MIO-KITCHEN-linux-${{ matrix.arch_suffix }}-android17
          path: './MIO-KITCHEN-linux.zip'

  build-macos:
    strategy:
      matrix:
        include:
          - os: macos-latest
            suffix: arm64
          - os: macos-13
            suffix: intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Packages
        run: |
          python3 -m pip install -U --force-reinstall pip requests
      - name: Pack Tool for macOS
        env:
          TARGET_ANDROID: "17"
        run: python3 build.py
      - name: Upload Macos Build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MIO-KITCHEN-macos-${{ matrix.suffix }}-android17
          path: './MIO-KITCHEN-macos.zip'

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Packages
        run: |
          python3 -m pip install -U --force-reinstall pip requests
          sudo apt update && sudo apt install -y erofs-utils android-sdk-libsparse-utils
      - name: Pack Tool for Android (Termux / ARM64 Native)
        env:
          TARGET_ANDROID: "17"
          PLATFORM_TARGET: "android"
        run: |
          python3 build.py || python3 build.py android || true
      - name: Upload Android Build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MIO-KITCHEN-android-arm64-android17
          path: './MIO-KITCHEN-android.zip'