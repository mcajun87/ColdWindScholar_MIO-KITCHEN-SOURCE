name: "构建Build Tool"
permissions:
  contents: write
  discussions: write

on:
  push:
    paths:
      - "bin/update.json"
  workflow_dispatch:
    inputs:
      publish_release:
        description: '是否发布到 Release？'
        required: true
        type: boolean
        default: true

jobs:
  build:
    if: always()
    needs: [build-win, build-linux, build-macos, build-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          merge-multiple: true
          
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install Packages
        run: |
          python3 -m pip install -U pip requests
          sudo apt update && sudo apt install -y git erofs-utils android-sdk-libsparse-utils
          
      - name: Generate Release Content
        run: |
          python3 build.py grb || true
          python3 build.py ma || true
          if [ ! -f "body.md" ] || grep -q "Create sync.yml" "body.md"; then
            echo "### MIO-KITCHEN 更新日志 (Changelog)" > body.md
            echo "" >> body.md
            git log -n 5 --pretty=format:"- %s (%an)" >> body.md
          fi
          
      - name: Upload release
        if: github.event_name == 'push' || github.event.inputs.publish_release == 'true'
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          omitBodyDuringUpdate: true
          removeArtifacts: true
          name: "MIO-KITCHEN Release (Android 17)"
          tag: "v4.2.1-build${{ github.run_number }}"
          bodyFile: "body.md"
          artifacts: "./artifacts/*.zip"

  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'
      - name: Update pip and dependencies
        run: |
          python -m pip install --upgrade pip wheel setuptools
          python -m pip install requests
          # 核心修复：彻底卸载新版，安装极度稳定的旧版
          python -m pip uninstall -y pyinstaller pyinstaller-hooks-contrib pywin32
          python -m pip install pyinstaller==6.2.0 pyinstaller-hooks-contrib==2023.10 pywin32==306
          
          # 暴力复制 DLL 到 Python 根目录，解决 No module named 'pywintypes'
          python -c "import pywin32_system32, shutil, os, sys; [shutil.copy(os.path.join(pywin32_system32.__path__[0], f), os.path.dirname(sys.executable)) for f in os.listdir(pywin32_system32.__path__[0]) if f.endswith('.dll')]"
      - name: Pack tool
        env:
          TARGET_ANDROID: "17"
        run: python build.py
      - name: Upload Win Build
        uses: actions/upload-artifact@v4
        with:
          name: MIO-KITCHEN-win
          path: './*.zip'

  build-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            arch_suffix: amd64
          - arch: arm64
            runner: ubuntu-latest
            arch_suffix: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Packages
        run: |
          python3 -m pip install -U pip requests
          sudo apt install liblzo2-dev erofs-utils -y
      - name: Pack Tool
        env:
          TARGET_ANDROID: "17"
        run: python3 build.py
      - name: Rename Artifact Safely
        run: |
          zip_files=(MIO-KITCHEN*.zip)
          if [ -f "${zip_files[0]}" ]; then
            mv "${zip_files[0]}" "MIO-KITCHEN-linux-${{ matrix.arch_suffix }}.zip"
          fi
      - name: Upload Linux Build
        uses: actions/upload-artifact@v4
        with:
          name: MIO-KITCHEN-linux-${{ matrix.arch_suffix }}
          path: './MIO-KITCHEN-linux-${{ matrix.arch_suffix }}.zip'

  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            suffix: arm64
          - os: macos-13
            suffix: intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Packages
        run: python3 -m pip install -U pip requests
      - name: Pack Tool
        env:
          TARGET_ANDROID: "17"
        run: python3 build.py
      - name: Rename Artifact
        run: |
          zip_files=(MIO-KITCHEN*.zip)
          if [ -f "${zip_files[0]}" ]; then
            mv "${zip_files[0]}" "MIO-KITCHEN-macos-${{ matrix.suffix }}.zip"
          fi
      - name: Upload macOS Build
        uses: actions/upload-artifact@v4
        with:
          name: MIO-KITCHEN-macos-${{ matrix.suffix }}
          path: './MIO-KITCHEN-macos-${{ matrix.suffix }}.zip'

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Install Packages
        run: |
          python3 -m pip install -U pip requests
          sudo apt install liblzo2-dev erofs-utils -y
      - name: Pack Tool
        env:
          TARGET_ANDROID: "17"
        run: python3 build.py || python3 build.py android || true
      - name: Upload Android Build
        uses: actions/upload-artifact@v4
        with:
          name: MIO-KITCHEN-android-arm64
          path: './*.zip'